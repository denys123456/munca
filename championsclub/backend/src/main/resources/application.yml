spring:
  application:
    name: championsclub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/championsclub}
    username: ${SPRING_DATASOURCE_USERNAME:championsclub}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

championsclub:
  ml:
    base-url: ${CHAMPIONSCLUB_ML_BASE_URL:http://localhost:8000}
  ai:
    provider: ${CHAMPIONSCLUB_AI_PROVIDER:DISABLED}
    api-key: ${CHAMPIONSCLUB_AI_API_KEY:}
    endpoint: ${CHAMPIONSCLUB_AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${CHAMPIONSCLUB_AI_MODEL:}
    timeout-seconds: ${CHAMPIONSCLUB_AI_TIMEOUT_SECONDS:12}
  security:
    jwt-secret: ${CHAMPIONSCLUB_JWT_SECRET}
  demo:
    enabled: false
    password: ${CHAMPIONSCLUB_DEMO_PASSWORD:manger123}
  synthetic-data:
    enabled: false
    directory: ${CHAMPIONSCLUB_SYNTHETIC_DATA_DIRECTORY:/app/data/generated}
    password: ${CHAMPIONSCLUB_DEMO_PASSWORD:manger123}
  scheduling:
    enabled: ${CHAMPIONSCLUB_SCHEDULING_ENABLED:true}
    cron: ${CHAMPIONSCLUB_SCHEDULING_CRON:0 0 6 * * *}
  cors:
    allowed-origin: ${CHAMPIONSCLUB_CORS_ALLOWED_ORIGIN:http://localhost:5173}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
