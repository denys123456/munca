services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: championsclub
      POSTGRES_USER: championsclub
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U championsclub -d championsclub"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    environment:
      CHAMPIONSCLUB_ML_ARTIFACT_DIR: /app/artifacts
    volumes:
      - ./ml-service/artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/championsclub
      SPRING_DATASOURCE_USERNAME: championsclub
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CHAMPIONSCLUB_JWT_SECRET: ${CHAMPIONSCLUB_JWT_SECRET:?Set a strong JWT secret in .env}
      CHAMPIONSCLUB_ML_BASE_URL: http://ml-service:8000
      CHAMPIONSCLUB_AI_PROVIDER: ${CHAMPIONSCLUB_AI_PROVIDER:-DISABLED}
      CHAMPIONSCLUB_AI_API_KEY: ${CHAMPIONSCLUB_AI_API_KEY:-}
      CHAMPIONSCLUB_AI_ENDPOINT: ${CHAMPIONSCLUB_AI_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      CHAMPIONSCLUB_AI_MODEL: ${CHAMPIONSCLUB_AI_MODEL:-}
      CHAMPIONSCLUB_DEMO_PASSWORD: ${CHAMPIONSCLUB_DEMO_PASSWORD:-}
      CHAMPIONSCLUB_SYNTHETIC_DATA_DIRECTORY: /app/data/generated
      CHAMPIONSCLUB_CORS_ALLOWED_ORIGIN: ${CHAMPIONSCLUB_CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      CHAMPIONSCLUB_SCHEDULING_ENABLED: ${CHAMPIONSCLUB_SCHEDULING_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data/generated:/app/data/generated:ro
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    profiles: ["frontend"]
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  data-generator:
    profiles: ["data"]
    build: ./data-pipeline
    command: ["python", "-m", "championsclub_data.cli", "generate", "--output", "/output", "--calibration", "/workspace/config/calibration.json", "--contracts", "${CHAMPIONSCLUB_DATASET_CONTRACTS:-300000}", "--dealerships", "${CHAMPIONSCLUB_DATASET_DEALERSHIPS:-40}", "--advisors", "${CHAMPIONSCLUB_DATASET_ADVISORS:-600}", "--seed", "${CHAMPIONSCLUB_DATASET_SEED:-20260916}", "--start", "2024-01-01", "--end", "2026-09-15"]
    volumes:
      - ./data/generated:/output

  ml-trainer:
    profiles: ["ml-training"]
    build: ./ml-service
    command: ["python", "-m", "app.training", "--data-dir", "/data", "--artifact-dir", "/artifacts"]
    volumes:
      - ./data/generated:/data:ro
      - ./ml-service/artifacts:/artifacts

volumes:
  postgres_data:
